<!doctype html>
<!-- Source for assets/og.png (1200x630 social preview). -->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=block">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #003c30 0%, #005a47 100%);
    color: #f7f4eb;
    font-family: "Noto Sans TC", "PingFang TC", sans-serif;
    padding: 60px 72px;
    display: flex;
    flex-direction: column;
    border-bottom: 12px solid #c5a659;
  }
  .eyebrow {
    align-self: flex-start;
    padding: 6px 20px;
    border-radius: 999px;
    background: #f7df8b;
    color: #182421;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: .08em;
  }
  h1 { margin: 28px 0 0; color: #fff; font-size: 80px; font-weight: 900; line-height: 1.15; }
  .lede { margin: 18px 0 0; font-size: 34px; font-weight: 700; color: #f7df8b; }
  .years { display: flex; gap: 14px; margin-top: auto; }
  .years span {
    flex: 1;
    padding: 16px 0;
    border-radius: 14px;
    background: #f7f4eb;
    box-shadow: 0 -6px 0 0 #c5a659;
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    color: #004d3d;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top .eyebrow { align-self: auto; }
  .heart { display: flex; gap: 8px; }
  .heart span { padding: 4px 12px; border-radius: 10px; color: #fff; font-size: 24px; font-weight: 900; line-height: 1.3; }
</style>
</head>
<body>
  <div class="top">
    <div class="eyebrow">國立高雄餐旅大學 · 旅館管理系</div>
    <div class="heart">
      <span style="background:#9e2a2b">服務精神</span><span style="background:#0b5394">專業整合</span><span style="background:#1f6173">旅館軟硬體</span><span style="background:#673ab7">理論實務</span><span style="background:#13744b">精通外語</span>
    </div>
  </div>
  <h1>高餐大旅館管理系<br>學習與職涯島嶼導覽器</h1>
  <p class="lede">務實致用 · 三明治教學法 · 群賢會館 · 菁英實習計畫3.0 · 1+3 畢業條件</p>
  <div class="years"><span>第一、二學年</span><span>第三學年校外實習</span><span>第四學年</span><span>分階段養成</span><span>系所核心資源</span></div>
</body>
</html>
